name: Update F&O lot sizes
on:
  schedule:
    - cron: "30 13 * * 1-5"   # 7:00 PM IST, after NSE publishes end-of-day files
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_lot_sizes.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/lot-sizes.json && [ -z "$(git status --porcelain public/lot-sizes.json)" ]; then echo "unchanged"; exit 0; fi
          git config user.name "lot-size-bot"
          git config user.email "lot-size-bot@users.noreply.github.com"
          git add public/lot-sizes.json
          git commit -m "Update F&O lot sizes from NSE"
          git push
